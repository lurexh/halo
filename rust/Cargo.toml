[package]
name = "halo-core"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Halo VPN native core: WireGuard (WARP/Proton), in-tunnel DNS adblock, stats."

[lib]
name = "halo_core"
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
jni = "0.21"
boringtun = "0.7.1"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2.10", features = ["json"] }
base64 = "0.22"
getrandom = "0.2"
time = { version = "0.3", features = ["formatting"] }
log = "0.4"
android_logger = "0.14"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
