name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        run: |
          set -e
          SDK="$HOME/android-sdk"
          mkdir -p "$SDK/cmdline-tools"
          curl -sSL -o /tmp/clt.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q /tmp/clt.zip -d "$SDK/cmdline-tools"
          mv "$SDK/cmdline-tools/cmdline-tools" "$SDK/cmdline-tools/latest"
          SM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SM" --sdk_root="$SDK" --licenses > /dev/null || true
          "$SM" --sdk_root="$SDK" "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$SDK/ndk/27.2.12479018" >> "$GITHUB_ENV"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"

      - name: Gradle 8.13
        run: |
          curl -sSL https://services.gradle.org/distributions/gradle-8.13-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /opt
          echo "/opt/gradle-8.13/bin" >> "$GITHUB_PATH"

      - name: Rust android target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Rust tests
        run: |
          set -o pipefail
          cargo test --manifest-path rust/Cargo.toml 2>&1 | tee ci-build.log

      - name: Build Rust core (arm64)
        run: |
          set -euo pipefail
          TC="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export PATH="$TC:$PATH"
          export CC_aarch64_linux_android="$TC/aarch64-linux-android24-clang"
          export AR_aarch64_linux_android="$TC/llvm-ar"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$TC/aarch64-linux-android24-clang"
          cd rust
          cargo build --release --target aarch64-linux-android 2>&1 | tee -a ../ci-build.log
          mkdir -p ../app/src/main/jniLibs/arm64-v8a
          cp target/aarch64-linux-android/release/libhalo_core.so ../app/src/main/jniLibs/arm64-v8a/
          ls -l ../app/src/main/jniLibs/arm64-v8a/

      - name: Assemble debug APK
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon 2>&1 | tee -a ci-build.log

      - name: Collect APK
        run: |
          mkdir -p dist
          find app/build/outputs/apk -name '*.apk' -exec cp {} dist/halo.apk \;
          ls -l dist

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          name: Halo ${{ github.ref_name }}
          files: dist/halo.apk
          generate_release_notes: true

      - name: Commit failure log
        if: failure()
        run: |
          {
            echo "run=$GITHUB_RUN_ID"
            echo "sha=$GITHUB_SHA"
            echo "date=$(date -u)"
            echo "-----"
            tail -c 400000 ci-build.log 2>/dev/null || true
          } > ci-build-tail.log
          git config user.name "halo-ci"
          git config user.email "ci@lurexh.invalid"
          git add -f ci-build-tail.log
          git commit -m "ci: build log [skip ci]" || true
          git push || true
