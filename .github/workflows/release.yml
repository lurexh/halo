name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Android NDK
        run: |
          sdkmanager "ndk;27.2.12479018" > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Gradle 8.13
        run: |
          curl -sSL https://services.gradle.org/distributions/gradle-8.13-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /opt
          echo "/opt/gradle-8.13/bin" >> "$GITHUB_PATH"

      - name: Rust targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: cargo-ndk
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk

      - name: Rust tests
        run: |
          set -o pipefail
          cargo test --manifest-path rust/Cargo.toml 2>&1 | tee ci-build.log

      - name: Build Rust core
        run: |
          set -o pipefail
          cargo ndk \
            -t arm64-v8a -t armeabi-v7a -t x86_64 \
            -o app/src/main/jniLibs \
            build --release --manifest-path rust/Cargo.toml 2>&1 | tee -a ci-build.log

      - name: Assemble debug APK
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon 2>&1 | tee -a ci-build.log

      - name: Collect APK
        run: |
          mkdir -p dist
          find app/build/outputs/apk -name '*.apk' -exec cp {} dist/halo.apk \;
          ls -l dist

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          name: Halo ${{ github.ref_name }}
          files: dist/halo.apk
          generate_release_notes: true

      - name: Commit failure log
        if: failure()
        run: |
          tail -c 200000 ci-build.log > ci-build-tail.log 2>/dev/null || true
          git config user.name "halo-ci"
          git config user.email "ci@lurexh.invalid"
          git add -f ci-build-tail.log
          git commit -m "ci: build log [skip ci]" || true
          git push || true
