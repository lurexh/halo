name: android

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Android NDK
        run: |
          sdkmanager "ndk;27.2.12479018" > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Gradle 8.13
        run: |
          curl -sSL https://services.gradle.org/distributions/gradle-8.13-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /opt
          echo "/opt/gradle-8.13/bin" >> "$GITHUB_PATH"

      - name: Rust targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: cargo-ndk
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk

      - name: Build Rust core
        run: |
          cargo ndk \
            -t arm64-v8a -t armeabi-v7a -t x86_64 \
            -o app/src/main/jniLibs \
            build --release --manifest-path rust/Cargo.toml 2>&1 | tee ci-build.log

      - name: Rust unit tests
        run: cargo test --manifest-path rust/Cargo.toml 2>&1 | tee -a ci-build.log

      - name: Decode keystore
        if: ${{ secrets.HALO_KEYSTORE_BASE64 != '' }}
        run: echo "${{ secrets.HALO_KEYSTORE_BASE64 }}" | base64 -d > app/halo-release.jks

      - name: Assemble APK
        run: |
          set -o pipefail
          if [ -n "${HALO_KEYSTORE:-}" ]; then
            gradle assembleRelease --no-daemon 2>&1 | tee -a ci-build.log
          else
            gradle assembleDebug --no-daemon 2>&1 | tee -a ci-build.log
          fi
        env:
          HALO_KEYSTORE: ${{ secrets.HALO_KEYSTORE_BASE64 != '' && 'app/halo-release.jks' || '' }}
          HALO_KEYSTORE_PASSWORD: ${{ secrets.HALO_KEYSTORE_PASSWORD }}
          HALO_KEY_ALIAS: ${{ secrets.HALO_KEY_ALIAS }}
          HALO_KEY_PASSWORD: ${{ secrets.HALO_KEY_PASSWORD }}

      - name: Collect APK
        run: |
          mkdir -p dist
          find app/build/outputs/apk -name '*.apk' -exec cp {} dist/halo.apk \;
          ls -l dist

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: halo-apk
          path: dist/halo.apk
          if-no-files-found: error

      - name: Publish nightly release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          name: Halo nightly
          body: "Automated build of the latest main."
          files: dist/halo.apk

      - name: Commit failure log (so it can be read without a token)
        if: failure()
        run: |
          tail -c 200000 ci-build.log > ci-build-tail.log || true
          git config user.name "halo-ci"
          git config user.email "ci@lurexh.invalid"
          git add -f ci-build-tail.log
          git commit -m "ci: build log [skip ci]" || true
          git push || true
