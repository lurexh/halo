name: android

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch OpenVPN engine
        run: |
          set -euo pipefail
          mkdir -p app/libs
          curl -L --fail --retry 3 \
            -o app/libs/icsopenvpn.aar \
            https://raw.githubusercontent.com/mysteriumnetwork/openvpn_dart/master/android/localmaven/network/mysterium/openvpn/icsopenvpn/0.7.55-myst/icsopenvpn-0.7.55-myst.aar
          echo "3540c8579b0056baac517cb6c930d9d9fb19cbbdf6216e4353fce5513aee50f6  app/libs/icsopenvpn.aar" | sha256sum -c -
          ls -l app/libs/icsopenvpn.aar

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        run: |
          set -e
          SDK="$HOME/android-sdk"
          mkdir -p "$SDK/cmdline-tools"
          curl -sSL -o /tmp/clt.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q /tmp/clt.zip -d "$SDK/cmdline-tools"
          mv "$SDK/cmdline-tools/cmdline-tools" "$SDK/cmdline-tools/latest"
          SM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SM" --sdk_root="$SDK" --licenses > /dev/null || true
          "$SM" --sdk_root="$SDK" "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$SDK/ndk/27.2.12479018" >> "$GITHUB_ENV"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"

      - name: Gradle 8.13
        run: |
          curl -sSL https://services.gradle.org/distributions/gradle-8.13-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /opt
          echo "/opt/gradle-8.13/bin" >> "$GITHUB_PATH"

      - name: Rust android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi, x86_64-linux-android

      - name: Build Rust core
        run: |
          set -euo pipefail
          TC="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export PATH="$TC:$PATH"
          build() {
            target="$1"
            cc="$2"
            abi="$3"
            key=$(echo "$target" | tr 'a-z-' 'A-Z_')
            export "CC_$(echo "$target" | tr '-' '_')=$TC/$cc"
            export "AR_$(echo "$target" | tr '-' '_')=$TC/llvm-ar"
            export "CARGO_TARGET_${key}_LINKER=$TC/$cc"
            (cd rust && cargo build --release --target "$target") 2>&1 | tee -a ci-build.log
            mkdir -p "app/src/main/jniLibs/$abi"
            cp "rust/target/$target/release/libhalo_core.so" "app/src/main/jniLibs/$abi/"
          }
          build aarch64-linux-android aarch64-linux-android24-clang arm64-v8a
          build armv7-linux-androideabi armv7a-linux-androideabi24-clang armeabi-v7a
          build x86_64-linux-android x86_64-linux-android24-clang x86_64
          find app/src/main/jniLibs -name '*.so' -ls

      - name: Rust unit tests
        run: |
          set -o pipefail
          cargo test --manifest-path rust/Cargo.toml 2>&1 | tee -a ci-build.log

      - name: Assemble debug APK
        run: |
          set -o pipefail
          for attempt in 1 2 3; do
            echo "== gradle attempt $attempt =="
            if gradle assembleDebug --no-daemon 2>&1 | tee -a ci-build.log; then
              exit 0
            fi
            sleep 30
          done
          exit 1

      - name: Collect APK
        run: |
          mkdir -p dist
          find app/build/outputs/apk -name '*.apk' -exec cp {} dist/halo.apk \;
          ls -l dist

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: halo-apk
          path: dist/halo.apk
          if-no-files-found: error

      - name: Publish nightly release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          name: Halo nightly
          body: "Automated build of the latest main."
          files: dist/halo.apk

      - name: Commit failure log
        if: failure()
        run: |
          {
            echo "run=$GITHUB_RUN_ID"
            echo "sha=$GITHUB_SHA"
            echo "date=$(date -u)"
            echo "-----"
            tail -c 400000 ci-build.log 2>/dev/null || true
          } > ci-build-tail.log
          git config user.name "halo-ci"
          git config user.email "ci@lurexh.invalid"
          git add -f ci-build-tail.log
          git commit -m "ci: build log [skip ci]" || true
          git push || true
